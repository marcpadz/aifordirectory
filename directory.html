<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse the full AI Atlas directory of AI tools, software, and services.">
  <title>AI Directory | AI Atlas</title>
  <link rel="preload" href="style.css" as="style">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Cpath d='M28 30h44v8H28zM28 44h32v8H28zM28 58h20v8H28z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="header-inner container">
      <a class="brand" href="/">AI<span class="brand-accent">Atlas</span></a>
      <nav class="nav">
        <a href="#directory" aria-current="page">Directory</a>
        <a href="news.html">News</a>
        <a href="#submit">Submit a Tool</a>
      </nav>
      <a class="btn btn-primary nav-cta" href="news.html">News</a>
      <button class="nav-toggle" aria-label="Open menu">&#9776;</button>
    </div>
  </header>

  <main id="content">
    <section class="section">
      <div class="container">
        <h1>AI Directory</h1>
        <p class="lead">Browse curated AI tools, software, and services by category.</p>

        <div class="toolbar" role="search" aria-label="Directory filters">
          <label for="cat-filter" class="visually-hidden">Filter by category</label>
          <select id="cat-filter">
            <option value="">All categories</option>
            <option>Writing</option>
            <option>Design</option>
            <option>Video</option>
            <option>Audio</option>
            <option>Coding</option>
            <option>Productivity</option>
            <option>Marketing</option>
            <option>Business</option>
            <option>Image</option>
            <option>3D</option>
          </select>
          <label for="dir-search" class="visually-hidden">Search tools</label>
          <input type="search" id="dir-search" placeholder="Search tools&hellip;" autocomplete="off">
          <span class="result-count" id="result-count"><span id="count-num">0</span> tools</span>
        </div>

        <div class="tools-grid" id="directory-grid">
          <!-- populated by app.js -->
        </div>
        <p class="empty-state" id="empty-state" hidden>No tools match your filters.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">AI<span class="brand-accent">Atlas</span></div>
      <p class="footer-copy">&copy; 2026 AI Atlas.</p>
    </div>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
